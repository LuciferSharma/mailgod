# Optional: durable flow execution via Temporal.
# Without Temporal (USE_TEMPORAL=false), flows run in-process — fine for most installs.
#
#   cd temporal && docker compose --env-file ../.env up -d
#
# Then set in .env:  USE_TEMPORAL=true  TEMPORAL_ADDRESS=localhost:7233
services:
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"
    restart: unless-stopped

  # The Temporal worker runs from the same image as the app.
  worker:
    build: ..
    depends_on:
      - temporal
    command: ["node", "server/dist/temporal/worker.js"]
    env_file: ../.env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - USE_TEMPORAL=true
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  postgres_data:
